<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - OpportunityHub</title>
<style>
/* Mesmo estilo que você já tinha */
body { 
  font-family: Arial, sans-serif; 
  background: url('fundo-login.png') no-repeat center center fixed; 
  background-size: cover; 
  display:flex; 
  align-items:center; 
  justify-content:center; 
  height:100vh; 
  margin:0;}

.login-container { 
  background-color:white; 
  padding:40px 50px; 
  border-radius:12px; 
  box-shadow:0 5px 20px rgba(0,0,0,0.15); 
  width:350px; 
  text-align:center;}

.login-container img { 
  width:150px; 
  margin-bottom:20px;}

h2 { 
  margin-bottom:20px; 
  color:#222;}

input, select { 
  width:100%; 
  padding:10px; 
  margin:8px 0; 
  border:1px solid #ccc; 
  border-radius:6px; 
  font-size:14px;}

button { 
  width:100%; 
  padding:10px; 
  margin-top:10px; 
  background-color:#0066cc; 
  color:white; 
  border:none; 
  border-radius:6px; 
  font-size:16px; 
  cursor:pointer; 
  transition:0.3s;}

button:hover { 
  background-color:#004da5;}

.back-btn { 
  background-color:#c4c4c4; 
  color:#222; margin-top:12px;}

.back-btn:hover { 
  background-color:#a9a9a9;}

.toggle-link { 
  margin-top:15px; 
  display:block; 
  font-size:14px; 
  color:#007BFF; 
  text-decoration:none; 
  cursor:pointer;}

.toggle-link:hover { 
  text-decoration:underline;}

.error-message { 
  color:red; 
  font-size:13px; 
  margin-top:8px; 
  display:none;}

.success-message { 
  color:green; 
  font-size:13px; 
  margin-top:8px; 
  display:none;}

#escolha-section button { 
  margin:10px 0; 
  font-weight:bold;}
  
</style>
</head>
<body>
<div class="login-container">
  <img src="OpportunityHub.png" alt="OpportunityHub Logo" />

  <!-- ESCOLHA -->
  <div id="escolha-section">
    <h2>Como deseja entrar?</h2>
    <button id="btnUsuario">Sou Usuário</button>
    <button id="btnColaborador">Sou Colaborador</button>
  </div>

  <!-- LOGIN -->
  <div id="login-section" style="display:none;">
    <h2 id="titulo">Login de Usuário</h2>
    <input type="email" id="emailLogin" placeholder="Email" />
    <input type="password" id="senhaLogin" placeholder="Senha" />
    <p id="loginError" class="error-message"></p>
    <button id="btnLogin">Entrar</button>
    <button class="back-btn" id="btnVoltarLogin">Voltar</button>
    <span class="toggle-link" id="linkCadastro">Não tem conta? Cadastre-se aqui</span>
  </div>

  <!-- CADASTRO -->
  <div id="cadastro-section" style="display:none;">
    <h2 id="tituloCadastro">Cadastro de Usuário</h2>
    <input type="text" id="nomeCadastro" placeholder="Nome completo" />
    <input type="tel" id="telefoneCadastro" placeholder="Telefone" />
    <input type="number" id="idadeCadastro" placeholder="Idade" />
    <select id="sexoCadastro">
      <option value="">Selecione o sexo</option>
      <option value="Masculino">Masculino</option>
      <option value="Feminino">Feminino</option>
      <option value="Outro">Outro</option>
    </select>
    <input type="email" id="emailCadastro" placeholder="Email" />
    <input type="password" id="senhaCadastro" placeholder="Senha" />
    <p id="cadastroError" class="error-message"></p>
    <p id="cadastroSuccess" class="success-message"></p>
    <button id="btnCadastrar">Cadastrar</button>
    <button class="back-btn" id="btnVoltarCadastro">Voltar</button>
  </div>
</div>

<script>
(function() {
  try {
    console.clear();
    console.log("Script init — iniciando verificação de elementos...");

    // Função utilitária para buscar elementos com checagem
    function $id(id) {
      const el = document.getElementById(id);
      if (!el) console.warn(`Elemento não encontrado: #${id}`);
      return el;
    }

    // certifica que todos os botões dentro do container sejam type="button"
    const allButtons = document.querySelectorAll(".login-container button");
    allButtons.forEach(btn => {
      if (!btn.hasAttribute("type")) {
        btn.setAttribute("type", "button");
        console.log("Ajustado type=button para:", btn);
      }
    });

    // checa disponibilidade do localStorage
    let storageOK = true;
    try {
      const testKey = "__lh_test";
      localStorage.setItem(testKey, "1");
      localStorage.removeItem(testKey);
      console.log("localStorage disponível");
    } catch (e) {
      storageOK = false;
      console.error("localStorage indisponível: ", e);
    }

    const escolhaSection = $id("escolha-section");
    const loginSection = $id("login-section");
    const cadastroSection = $id("cadastro-section");

    function mostrarEscolha() {
      if (escolhaSection) escolhaSection.style.display = "block";
      if (loginSection) loginSection.style.display = "none";
      if (cadastroSection) cadastroSection.style.display = "none";
    }

    function mostrarLogin() {
      if (escolhaSection) escolhaSection.style.display = "none";
      if (loginSection) loginSection.style.display = "block";
      if (cadastroSection) cadastroSection.style.display = "none";
      const el = $id("loginError"); if (el) el.style.display = "none";
    }

    function mostrarCadastro() {
      if (escolhaSection) escolhaSection.style.display = "none";
      if (loginSection) loginSection.style.display = "none";
      if (cadastroSection) cadastroSection.style.display = "block";
      const e1 = $id("cadastroError"); if (e1) e1.style.display = "none";
      const e2 = $id("cadastroSuccess"); if (e2) e2.style.display = "none";
    }

    function cadastrarUsuario() {
      try {
        const nome = $id("nomeCadastro")?.value.trim() || "";
        const telefone = $id("telefoneCadastro")?.value.trim() || "";
        const idade = $id("idadeCadastro")?.value.trim() || "";
        const sexo = $id("sexoCadastro")?.value || "";
        const email = $id("emailCadastro")?.value.trim() || "";
        const senha = $id("senhaCadastro")?.value.trim() || "";
        const erro = $id("cadastroError");
        const sucesso = $id("cadastroSuccess");

        if (!nome || !telefone || !idade || !sexo || !email || !senha) {
          if (erro) { erro.innerText = "Preencha todos os campos corretamente."; erro.style.display = "block"; }
          if (sucesso) sucesso.style.display = "none";
          return;
        }

        if (!storageOK) {
          if (erro) { erro.innerText = "Erro: localStorage indisponível."; erro.style.display = "block"; }
          return;
        }

        let usuarios = JSON.parse(localStorage.getItem("usuarios") || "[]");
        if (!Array.isArray(usuarios)) usuarios = [];
        usuarios = usuarios.filter(u => u && u.email && u.senha);
        if (usuarios.some(u => u?.email?.toLowerCase() === email.toLowerCase())) {
          if (erro) { erro.innerText = "Este email já está cadastrado."; erro.style.display = "block"; }
          if (sucesso) sucesso.style.display = "none";
          return;
        }

        usuarios.push({nome, telefone, idade, sexo, email, senha});
        localStorage.setItem("usuarios", JSON.stringify(usuarios));

        if (sucesso) { sucesso.innerText = "Cadastro realizado com sucesso!"; sucesso.style.display = "block"; }
        if (erro) erro.style.display = "none";
        setTimeout(()=>{ mostrarLogin(); if (sucesso) sucesso.style.display="none"; }, 1500);
      } catch (err) {
        console.error("Erro em cadastrarUsuario:", err);
        const erro = $id("cadastroError");
        if (erro) { erro.innerText = "Erro interno ao cadastrar (ver console)."; erro.style.display = "block"; }
      }
    }

    function loginUsuario() {
      try {
        const email = $id("emailLogin")?.value.trim() || "";
        const senha = $id("senhaLogin")?.value.trim() || "";
        const erro = $id("loginError");

        if (!storageOK) {
          if (erro) { erro.innerText = "Erro: localStorage indisponível."; erro.style.display = "block"; }
          return;
        }

        const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
        const usuarioValido = usuarios.find(u => u.email.toLowerCase() === email.toLowerCase() && u.senha === senha);

        if (usuarioValido) {
          localStorage.setItem("usuarioLogado", JSON.stringify(usuarioValido));
          console.log("Login bem-sucedido. Redirecionando para index.html");
          window.location.href = "index.html";
        } else {
          if (erro) { erro.innerText = "Email ou senha inválidos."; erro.style.display = "block"; }
        }
      } catch (err) {
        console.error("Erro em loginUsuario:", err);
        const erro = $id("loginError");
        if (erro) { erro.innerText = "Erro interno ao logar (ver console)."; erro.style.display = "block"; }
      }
    }

    // Registra listeners só se os elementos existirem
    const listeners = [
      {id: "btnUsuario", fn: mostrarLogin},
      {id: "btnColaborador", fn: ()=>window.location.href="colaboradores.html"},
      {id: "linkCadastro", fn: mostrarCadastro},
      {id: "btnVoltarLogin", fn: mostrarEscolha},
      {id: "btnVoltarCadastro", fn: mostrarLogin},
      {id: "btnCadastrar", fn: cadastrarUsuario},
      {id: "btnLogin", fn: loginUsuario}
    ];

    listeners.forEach(item => {
      const el = $id(item.id);
      if (el) {
        el.addEventListener("click", item.fn);
        console.log(`Listener registrado: #${item.id}`);
      } else {
        console.warn(`Não foi possível registrar listener (elemento ausente): #${item.id}`);
      }
    });

    console.log("Inicialização concluída. Teste clicando nos botões e observando o Console.");

  } catch (fatal) {
    console.error("Erro fatal no script de login:", fatal);
  }
})();
</script>
</body>
</html>
